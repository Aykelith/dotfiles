---
- name: Configure zsh
  hosts: localhost
  connection: local

  vars:
    # /bin/zsh is the system zsh on macOS and is in /etc/shells on Debian too.
    zsh_path: /bin/zsh

  tasks:
    # KEEP_ZSHRC stops the installer replacing the .zshrc synced by 02-sync-dotfiles.yml.
    - name: Install oh-my-zsh
      ansible.builtin.shell: |
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      args:
        creates: "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
      environment:
        RUNZSH: "no"
        CHSH: "no"
        KEEP_ZSHRC: "yes"

    # Skipped when already set (macOS default), so no sudo prompt there.
    - name: Set zsh as default shell
      ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        shell: "{{ zsh_path }}"
      become: true
      when: ansible_facts.user_shell | basename != "zsh"
