---
- name: Set up Neovim config
  hosts: localhost
  connection: local

  tasks:
    - name: Clone neovim dotfiles
      ansible.builtin.git:
        repo: git@github.com:Aykelith/neovim.dotfiles.git
        dest: "{{ ansible_facts.env.HOME }}/.config/nvim"
        update: false

    - name: Run neovim init script
      ansible.builtin.command:
        cmd: "{{ ansible_facts.env.HOME }}/.config/nvim/scripts/run-init.sh"
      changed_when: true

    # Git runs core.editor through sh, so the fallback is picked at each use.
    - name: Use nvim as git editor, vim if nvim is missing
      ansible.builtin.command:
        argv: [git, config, --global, core.editor, "$(command -v nvim || echo vim)"]
      changed_when: true
