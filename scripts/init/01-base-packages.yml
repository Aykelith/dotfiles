---
- name: Install base packages
  hosts: localhost
  connection: local

  tasks:
    - name: Install base packages (Debian)
      become: true
      ansible.builtin.apt:
        name:
          - git
          - build-essential
          - curl
          - zsh
          - jq
          - rsync
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    # Compilers come from the Xcode Command Line Tools, which Homebrew requires.
    # Homebrew refuses to run as root, so no become here.
    - name: Install base packages (macOS)
      community.general.homebrew:
        name:
          - git
          - jq
        state: present
        update_homebrew: true
      when: ansible_facts.os_family == "Darwin"

    - name: Install Homebrew packages from Brewfile (macOS)
      ansible.builtin.command:
        cmd: brew bundle install --file={{ ansible_facts.env.HOME }}/dotfiles/data/homebrew/Brewfile
      register: brew_bundle
      changed_when: "'Installing' in brew_bundle.stdout or 'Upgrading' in brew_bundle.stdout"
      when: ansible_facts.os_family == "Darwin"
